version = 1
SPDX-PackageName = "risala"
SPDX-PackageSupplier = "Risala developers <dev@risa.la>"

# Code and everything else.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Risala developers"
SPDX-License-Identifier = "Apache-2.0"

# The protocol specification. Later matches win, so this overrides the
# Apache-2.0 default above.
[[annotations]]
path = "spec/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Risala developers"
SPDX-License-Identifier = "CC-BY-4.0"

# JetBrains Mono, bundled with the Apple client.
[[annotations]]
path = "clients/apple/Resources/Fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# openmls_traits, patched for the cipher suite value, keeps its MIT license.
[[annotations]]
path = "crates/openmls-traits/**"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) OpenMLS Authors", "Copyright (c) 2026 Risala developers"]
SPDX-License-Identifier = "MIT"

# Our port of openmls_sqlite_storage, which keeps its MIT license.
[[annotations]]
path = "crates/openmls-sqlite-storage/**"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) OpenMLS Authors", "Copyright (c) 2026 Risala developers"]
SPDX-License-Identifier = "MIT"
