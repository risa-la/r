\* With every proposed fix, one device that posts one message or commit:
\* TLC checks every reachable state.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1}
    MaxPosts = 2
    MaxCommits = 2
    MaxMoves = 1
    MaxEnvMsgs = 1
    MaxOwn = 1
    PageSize = 1
    Jitter = 1
    Fixes = {"GapLost", "SameCommit", "EndAfterUse"}
INVARIANTS
    SyncPointSound
    CaughtUpHasAll
    NoMixedMailboxes
    OnCanonicalChain
    OwnPostsCanonical
    CidOkIsOwn
    AtMostOnce
    ConversationGoesOn
CHECK_DEADLOCK FALSE
