# Throwaway spike: checks that OpenMLS can do what SPEC.md Section 12
# (draft-02) asks of it. Not part of the risala workspace.
[package]
name = "mls-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
openmls = { version = "=0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "0.4", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = { version = "0.3", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
ml-dsa = "0.1.2"
libcrux-ml-dsa = "0.0.11"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
# Same rusqlite as openmls_sqlite_storage 0.3 (see the storage check).
rusqlite = "0.37"
serde = "1"
serde_json = "1"

[profile.dev]
opt-level = 3
