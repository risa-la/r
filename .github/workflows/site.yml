name: Site

# Builds the website in site/ and publishes it to GitHub Pages at risa.la.
# The site reads SPEC.md from the repository root, so changes to it publish
# too. Pull requests build without publishing.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "SPEC.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "SPEC.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push replaces a queued one, but a publish
# already running is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
