name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L

  # risala-pow's JIT against its interpreter, for many seeds and nonces.
  # The normal tests run a few hundred; this runs 320,000, in release.
  pow-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: cargo test --release -p risala-pow -- --ignored
        run: nix develop --command cargo test --release -p risala-pow -- --ignored

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: cargo kani (risala-proto)
        uses: model-checking/kani-github-action@v1
        with:
          args: -p risala-proto -j 2 --output-format terse -Z unstable-options --harness-timeout 2m
      - name: cargo kani (risala-pow)
        uses: model-checking/kani-github-action@v1
        with:
          args: -p risala-pow -j 2 --output-format terse -Z unstable-options --harness-timeout 2m
