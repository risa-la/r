[workspace]
resolver = "3"
exclude = ["crates/risala-proto/fuzz"]
members = [
    "crates/risala-proto",
    "crates/risala-server",
    "crates/librisala", "crates/risala-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/risa-la/r"
authors = ["Risala developers <dev@risa.la>"]

[workspace.dependencies]
risala-proto = { path = "crates/risala-proto" }

base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pem"] }
ed25519 = { version = "3", features = ["zeroize"] }
sha2 = "0.11"
thiserror = "2"

# I/O, TLS and storage (server, librisala, CLI). TLS uses ring, not
# aws-lc-rs, so builds need no cmake and cross-compile easily.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-platform-verifier = "0.7"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
librisala = { path = "crates/librisala" }

# dev
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
# Kani proofs (crates/risala-proto/src/proofs.rs) build under cfg(kani).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
