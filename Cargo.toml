[workspace]
resolver = "3"
exclude = ["crates/risala-proto/fuzz", "crates/risala-pow/fuzz"]
members = [
    "crates/risala-proto",
    "crates/risala-server",
    "crates/librisala", "crates/risala-cli",
    "crates/risala-keyfetch",
    "crates/risala-pow",
    "crates/risala-dev",

    "crates/openmls-sqlite-storage",
    "crates/risala-mls",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/risa-la/r"
authors = ["Risala developers <dev@risa.la>"]

[workspace.dependencies]
risala-proto = { path = "crates/risala-proto" }
risala-keyfetch = { path = "crates/risala-keyfetch" }
# OpenMLS storage in SQLite, ported (see [patch.crates-io] below).
openmls_sqlite_storage = { path = "crates/openmls-sqlite-storage" }
risala-mls = { path = "crates/risala-mls" }

base64 = "0.23"
# ML-DSA (FIPS 204), Cryspen's formally verified libcrux implementation.
# The MLS layer (SPEC 12.2) adds it to openmls_libcrux_crypto, so a binary
# carries one ML-DSA. Only ML-DSA-44, and no std (it is needed only for
# tls_codec). The build script turns on AVX2 or NEON code, chosen at run time.
libcrux-ml-dsa = { version = "0.0.11", default-features = false, features = ["mldsa44"] }
sha2 = "0.11"
thiserror = "2"
zeroize = "1"

# I/O, TLS and storage (server, librisala, CLI). TLS uses the aws-lc-rs
# provider, the only rustls provider with X25519MLKEM768 (SPEC 2.1).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging"] }
rustls = { version = "0.23.27", default-features = false, features = ["aws-lc-rs", "std", "logging"] }
rustls-platform-verifier = "0.7"
# Mozilla's CA roots, for fetching key files (SPEC 4.4). Already in the tree
# through rustls-platform-verifier.
webpki-root-certs = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
getrandom = "0.4"
# mmap and mprotect, for the executable memory of risala-pow's JIT. Already
# in the tree through tokio and getrandom.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
librisala = { path = "crates/librisala" }

# MLS (SPEC 12), as chosen by the spike (PLAN.md 22). OpenMLS is pinned
# exactly, since the server and devices check what it does not (12.5, 12.6).
openmls = { version = "=0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "0.4", features = ["draft-ietf-mls-pq-ciphersuites"] }
# MessagePack, the codec for MLS state in SQLite (crates/openmls-sqlite-storage).
rmp-serde = "1"
# The TLS presentation language, for risala's own MLS structures (SPEC 12.2,
# 12.8). The version OpenMLS uses.
tls_codec = { version = "0.5", features = ["derive", "mls"] }
# The primitives under openmls_libcrux_crypto, which risala-mls also uses
# directly for history keys, encrypted messages and backups (SPEC 12.8-12.10).
libcrux-hkdf = "0.0.8"
libcrux-hmac = "0.0.8"
libcrux-chacha20poly1305 = "0.0.9"

# dev
openmls_basic_credential = "0.6"
proptest = "1"
# An independent x86-64 decoder (MIT), to check every instruction encoding
# risala-pow's JIT emits and to verify the code it compiles.
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
# An independent A64 decoder (0BSD), for the same checks of the aarch64 JIT.
yaxpeax-arm = { version = "0.5", default-features = false, features = ["std"] }
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"

# Our port of openmls_sqlite_storage, to rusqlite 0.41. OpenMLS lists the
# upstream crate as an optional dependency, and Cargo refuses its older
# libsqlite3-sys next to ours even with the feature off. The port takes its
# place everywhere.
[patch.crates-io]
openmls_sqlite_storage = { path = "crates/openmls-sqlite-storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Kani proofs (crates/risala-proto/src/proofs.rs) build under cfg(kani).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ML-DSA is slow unoptimised, and tests across the workspace sign in. Build
# it, and the Keccak and helper code under it, optimised in dev too.
[profile.dev.package.libcrux-ml-dsa]
opt-level = 3

[profile.dev.package.libcrux-sha3]
opt-level = 3

[profile.dev.package.libcrux-intrinsics]
opt-level = 3

[profile.dev.package.libcrux-secrets]
opt-level = 3
