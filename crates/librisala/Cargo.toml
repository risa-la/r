[package]
name = "librisala"
description = "The risala client library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
risala-proto.workspace = true
risala-mls.workspace = true
risala-keylog.workspace = true
risala-keyfetch.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
getrandom.workspace = true
# P-256, HKDF and AES-128-GCM for push bodies (9.3, RFC 8291), as the
# server uses; already in the tree as rustls's provider.
aws-lc-rs.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
serde_json.workspace = true
zeroize.workspace = true
openmls_sqlite_storage.workspace = true
# A public room's group as an outsider sees it, before joining (6.1, 12.7).
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }

# SQLCipher, to encrypt the cache (PLAN.md 43). On Apple platforms it uses
# CommonCrypto. Elsewhere it uses OpenSSL's libcrypto, built from source
# and linked statically, since Android has no libcrypto for apps and plain
# cargo builds need no OpenSSL headers. Nix builds set OPENSSL_NO_VENDOR to
# link nixpkgs' OpenSSL instead.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
proptest.workspace = true
openmls.workspace = true
openmls_libcrux_crypto.workspace = true
openmls_basic_credential.workspace = true
openmls_traits.workspace = true
# A whole risalad for the identity and conversation tests
# (tests/identity_server.rs, client/conversations/server_tests.rs), and its
# push bodies, decrypted by the client (client/push.rs).
risala-server = { path = "../risala-server" }
risala-keylog.workspace = true

[lints]
workspace = true
