[package]
name = "risala-mls"
description = "The MLS layer of risala (SPEC 12): the cipher suite's provider, leaf keys, credentials and extensions, KeyPackages, groups and their checks, and the framing the server reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
risala-proto.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
openmls_libcrux_crypto.workspace = true
libcrux-ml-dsa.workspace = true
libcrux-hkdf.workspace = true
libcrux-hmac.workspace = true
libcrux-chacha20poly1305.workspace = true
tls_codec.workspace = true
sha2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
zeroize.workspace = true
base64.workspace = true
serde.workspace = true
# A throwaway storage, for the first of the two builds that bind a leaf's
# keys (src/seeded.rs).
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }

[dev-dependencies]
# The patched port in crates/openmls-sqlite-storage (see the root Cargo.toml).
openmls_sqlite_storage.workspace = true
rusqlite.workspace = true
# HPKE with the KEM id spelled out, to pin what the provider sends (SPEC 12.2).
hpke-rs = "0.7"
hpke-rs-crypto = "0.7"
hpke-rs-libcrux = "0.7"

[lints]
workspace = true
