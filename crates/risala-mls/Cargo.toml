[package]
name = "risala-mls"
description = "The MLS layer of risala (SPEC 12): the cipher suite's provider, leaf keys, credentials and extensions, KeyPackages, groups and their checks, and the framing the server reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
risala-proto.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
openmls_libcrux_crypto.workspace = true
libcrux-ml-dsa.workspace = true
libcrux-hkdf.workspace = true
libcrux-hmac.workspace = true
libcrux-chacha20poly1305.workspace = true
tls_codec.workspace = true
sha2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
zeroize.workspace = true
base64.workspace = true
serde.workspace = true
# A throwaway storage, for the first of the two builds that bind a leaf's
# keys (src/seeded.rs).
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
# HPKE in mode_psk for pairing (SPEC 4.8): the hpke-rs and libcrux backend
# that openmls_libcrux_crypto seals with, since OpenMLS's crypto trait has
# base mode only.
hpke-rs = "0.7"
hpke-rs-crypto = "0.7"
hpke-rs-libcrux = "0.7"
# X-Wing as a KEM on its own, for leaf challenges (SPEC 12.10): the same
# libcrux-kem that hpke-rs-libcrux and openmls_libcrux_crypto use.
libcrux-kem = "=0.0.9"

[dev-dependencies]
# The patched port in crates/openmls-sqlite-storage (see the root Cargo.toml).
openmls_sqlite_storage.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

[lints]
workspace = true
