[package]
name = "risala-server"
description = "risalad, the risala server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "risalad"
path = "src/main.rs"

[lib]
name = "risala_server"
path = "src/lib.rs"

[dependencies]
risala-proto.workspace = true
risala-keyfetch.workspace = true
risala-mls.workspace = true
rmp-serde.workspace = true
tls_codec.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
rustls.workspace = true
rusqlite.workspace = true
rcgen.workspace = true
getrandom.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Paused time for the keepalive tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
proptest.workspace = true
# Devices' MLS state in the hub's tests of groups (12).
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }

[lints]
workspace = true
