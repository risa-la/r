[package]
name = "risala-server"
description = "risalad, the risala server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "risalad"
path = "src/main.rs"

[lib]
name = "risala_server"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
risala-proto.workspace = true
risala-keyfetch.workspace = true
risala-mls.workspace = true
# The key log and witnessing (4.5, 4.10).
risala-keylog.workspace = true
webpki-root-certs.workspace = true
rmp-serde.workspace = true
tls_codec.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
rustls.workspace = true
rusqlite.workspace = true
rcgen.workspace = true
getrandom.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Push (9.3): RFC 8291 encryption.
aws-lc-rs.workspace = true
# OpenMLS's state of public rooms' groups, which the server checks (12.6).
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }

[dev-dependencies]
# Paused time for the keepalive tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
